<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="Dashboard local Github Mini pentru proiecte, task-uri și repo-uri." />
  <title>Dashboard — Github Mini</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#171d2a;--panel-strong:#111827;--soft:#0d1520;--text:#e6edf3;--muted:#9aa7b5;--border:rgba(148,163,184,.2);--blue:#2f81f7;--green:#3fb950;--yellow:#fbbf24;--orange:#f0883e;--danger:#f87171;--shadow:0 18px 42px rgba(0,0,0,.38)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at top,rgba(47,129,247,.18),transparent 28%),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}input{color:var(--text)}.container{width:min(1200px,calc(100% - 24px));margin:auto}.header{background:rgba(13,17,23,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-mark{position:relative;width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#fff,#aab7c4)}.brand-mark:after{content:"";position:absolute;inset:7px;border-radius:4px;background:#111827}.actions{display:flex;align-items:center;gap:8px}.btn{display:inline-flex;min-height:42px;align-items:center;justify-content:center;padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);color:var(--text);font-weight:650;cursor:pointer}.btn:hover{border-color:rgba(47,129,247,.8)}.btn.primary{background:linear-gradient(180deg,#388bfd,#1f6feb);border-color:#388bfd}.main{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{padding:18px 14px;border-right:1px solid var(--border);background:rgba(15,23,42,.55)}.profile{padding:14px;border:1px solid var(--border);border-radius:16px;background:rgba(17,24,39,.8);margin-bottom:16px}.profile strong{display:block;margin-bottom:5px}.profile .meta{color:var(--muted);font-size:.88rem}.nav-list{display:flex;flex-direction:column;gap:8px}.nav-item{padding:10px 12px;border-radius:10px;color:var(--muted);border:1px solid transparent}.nav-item.active{color:var(--text);background:rgba(47,129,247,.08);border-color:rgba(47,129,247,.2)}.content{padding:28px 20px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.topbar h1{margin:0;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.05em}.pill{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid rgba(240,136,62,.38);border-radius:999px;background:rgba(240,136,62,.08);color:#fbd3ad;font-size:.76rem;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:rgba(22,27,34,.82)}.stat-label{color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;font-size:clamp(1.4rem,2vw,2.1rem);margin-top:8px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{padding:18px;border:1px solid var(--border);border-radius:18px;background:rgba(22,27,34,.82);box-shadow:var(--shadow)}.panel h2{margin:0 0 12px;font-size:1.08rem}.form-grid{display:grid;grid-template-columns:1fr auto;gap:10px}.field{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#0d1117}.field:focus{outline:2px solid #79c0ff;outline-offset:2px}.add-btn{min-width:120px}.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(17,24,39,.8)}.item strong{display:block}.item small{color:var(--muted)}.remove{padding:6px 8px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:8px;cursor:pointer}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid var(--border);font-size:.72rem;font-weight:700}.tag.green{color:#a7f3d0;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}.tag.orange{color:#fdba74;border-color:rgba(240,136,62,.35);background:rgba(240,136,62,.08)}.tag.red{color:#fca5a5;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}.repo-list{display:flex;flex-direction:column;gap:10px}.repo-item{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(17,24,39,.8)}.repo-item strong{display:block}.repo-item small{color:var(--muted)}.footer-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.warning{margin-top:16px;padding:12px;border:1px solid rgba(240,136,62,.3);border-radius:10px;background:rgba(240,136,62,.08);color:#fbd3ad;font-size:.86rem}.activity-list{display:flex;flex-direction:column;gap:10px}.activity{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(17,24,39,.8)}.activity strong{display:block}.activity small{color:var(--muted)}.empty{padding:12px;border:1px dashed var(--border);border-radius:12px;color:var(--muted);text-align:center}.message{min-height:24px;color:#fca5a5;margin:0 0 8px}.hidden-input{display:none}@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.topbar{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.actions{gap:6px}.btn{padding:8px 10px}} 
  </style>
</head>
<body>
  <header class="header"><div class="container nav"><a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"></span><span>Github Mini</span></a><div class="actions"><button class="btn primary" id="logout" type="button">Ieși</button></div></div></header>
  <div class="container main">
    <aside class="sidebar">
      <div class="profile"><strong id="user-name">Utilizator</strong><div class="meta">Mod local · fără verificare</div></div>
      <nav class="nav-list">
        <div class="nav-item active">Overview</div>
        <div class="nav-item">Projects</div>
        <div class="nav-item">Tasks</div>
        <div class="nav-item">Activity</div>
      </nav>
    </aside>
    <main class="content">
      <div class="topbar"><h1>Dashboard</h1><span class="pill">Local demo</span></div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <section class="stats">
        <div class="stat"><div class="stat-label">Proiecte</div><strong id="count-projects">0</strong></div>
        <div class="stat"><div class="stat-label">Task-uri</div><strong id="count-tasks">0</strong></div>
        <div class="stat"><div class="stat-label">Repo-uri</div><strong id="count-repos">0</strong></div>
        <div class="stat"><div class="stat-label">Status</div><strong>Live</strong></div>
      </section>
      <section class="layout">
        <div>
          <div class="panel">
            <h2>Adaugă proiect</h2>
            <form id="project-form"><div class="form-grid"><input class="field" id="project-name" type="text" maxlength="80" placeholder="Numele proiectului" required /><button class="btn primary add-btn" type="submit">Adaugă</button></div></form>
            <div class="list" id="project-list"></div>
            <div class="footer-actions"><button class="btn" id="export" type="button">Exportă backup</button><button class="btn" id="import-btn" type="button">Importă backup</button><input class="hidden-input" id="import-file" type="file" accept="application/json,.json" /></div>
            <div class="warning">Datele sunt stocate local în browser. Exportă backup-ul dacă vrei să-l păstrezi.</div>
          </div>
        </div>
        <div>
          <div class="panel">
            <h2>Adaugă task</h2>
            <form id="task-form"><div class="form-grid"><input class="field" id="task-name" type="text" maxlength="80" placeholder="Task nou" required /><button class="btn primary add-btn" type="submit">Salvează</button></div></form>
            <div class="list" id="task-list"></div>
          </div>
          <div class="panel" style="margin-top:16px;">
            <h2>Repo-uri</h2>
            <div class="repo-list" id="repo-list"></div>
          </div>
          <div class="panel" style="margin-top:16px;">
            <h2>Activitate recentă</h2>
            <div class="activity-list" id="activity-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const SESSION_KEY = 'github-mini-session';
    const PROJECT_KEY = 'github-mini-projects';
    const TASK_KEY = 'github-mini-tasks';
    const REPO_KEY = 'github-mini-repos';
    const ACTIVITY_KEY = 'github-mini-activity';

    const defaultRepos = [
      { name: 'github-mini/ui', status: 'Activ', type: 'green' },
      { name: 'github-mini/api', status: 'În lucru', type: 'orange' },
      { name: 'github-mini/cli', status: 'Nou', type: 'green' }
    ];

    const getSession = () => {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
      catch { return null; }
    };

    const getArray = (key, fallback) => {
      try {
        const value = JSON.parse(localStorage.getItem(key) || 'null');
        return Array.isArray(value) ? value : fallback;
      } catch {
        return fallback;
      }
    };

    const session = getSession();
    if (!session?.name) {
      window.location.replace('./auth.html');
    }

    const userName = document.getElementById('user-name');
    userName.textContent = session?.name || 'Utilizator';

    let projects = getArray(PROJECT_KEY, [{ name: 'Github Mini v1', createdAt: new Date().toISOString() }]);
    let tasks = getArray(TASK_KEY, [
      { name: 'Componente dashboard responsive', createdAt: new Date().toISOString(), done: true },
      { name: 'Îmbunătățire login local', createdAt: new Date().toISOString(), done: false },
      { name: 'Export backup JSON', createdAt: new Date().toISOString(), done: false }
    ]);
    let repos = getArray(REPO_KEY, defaultRepos);
    let activity = getArray(ACTIVITY_KEY, [
      { title: 'UI refactor', detail: 'Componentele responsive au fost finalizate.', createdAt: new Date().toISOString() },
      { title: 'Task nou', detail: 'A fost adăugat un task de sprint local.', createdAt: new Date().toISOString() },
      { title: 'Backup', detail: 'S-a exportat o copie de siguranță.', createdAt: new Date().toISOString() }
    ]);

    const save = () => {
      localStorage.setItem(PROJECT_KEY, JSON.stringify(projects));
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
      localStorage.setItem(REPO_KEY, JSON.stringify(repos));
      localStorage.setItem(ACTIVITY_KEY, JSON.stringify(activity));
    };

    const setMessage = (text) => {
      document.getElementById('message').textContent = text;
    };

    const renderProjects = () => {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      if (!projects.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Fără proiecte. Adaugă unul nou.';
        list.appendChild(empty);
        return;
      }
      projects.forEach((project, idx) => {
        const row = document.createElement('div');
        row.className = 'item';
        const date = new Date(project.createdAt).toLocaleDateString();
        row.innerHTML = `<div><strong>${project.name}</strong><small>${date}</small></div><button class="remove" type="button" data-index="${idx}">Șterge</button>`;
        list.appendChild(row);
      });
      list.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = Number(btn.dataset.index);
          projects.splice(index, 1);
          save();
          render();
        });
      });
    };

    const renderTasks = () => {
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      if (!tasks.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Fără task-uri. Adaugă unul nou.';
        list.appendChild(empty);
        return;
      }
      tasks.forEach((task, idx) => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `<div><strong>${task.name}</strong><small>${task.done ? 'Finalizat' : 'În desfășurare'}</small></div><span class="tag ${task.done ? 'green' : 'orange'}">${task.done ? 'Done' : 'Todo'}</span>`;
        row.addEventListener('click', () => {
          tasks[idx].done = !tasks[idx].done;
          save();
          render();
        });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = 'Șterge';
        remove.addEventListener('click', (event) => {
          event.stopPropagation();
          tasks.splice(idx, 1);
          save();
          render();
        });
        row.appendChild(remove);
        list.appendChild(row);
      });
    };

    const renderRepos = () => {
      const list = document.getElementById('repo-list');
      list.innerHTML = '';
      repos.forEach(repo => {
        const item = document.createElement('div');
        item.className = 'repo-item';
        item.innerHTML = `<strong>${repo.name}</strong><small>${repo.status}</small>`;
        list.appendChild(item);
      });
    };

    const renderActivity = () => {
      const list = document.getElementById('activity-list');
      list.innerHTML = '';
      activity.slice(0, 5).forEach(item => {
        const row = document.createElement('div');
        row.className = 'activity';
        row.innerHTML = `<div><strong>${item.title}</strong><small>${item.detail}</small></div><span class="tag ${item.type || 'orange'}">${new Date(item.createdAt).toLocaleDateString()}</span>`;
        list.appendChild(row);
      });
    };

    const renderStats = () => {
      document.getElementById('count-projects').textContent = String(projects.length);
      document.getElementById('count-tasks').textContent = String(tasks.length);
      document.getElementById('count-repos').textContent = String(repos.length);
    };

    const render = () => {
      renderProjects();
      renderTasks();
      renderRepos();
      renderActivity();
      renderStats();
    };

    document.getElementById('project-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const input = document.getElementById('project-name');
      const value = input.value.trim();
      if (!value) return;
      projects.unshift({ name: value, createdAt: new Date().toISOString() });
      activity.unshift({ title: 'Project adăugat', detail: `${value} a fost adăugat local.`, createdAt: new Date().toISOString(), type: 'green' });
      save();
      input.value = '';
      render();
      setMessage('Proiect adăugat local.');
    });

    document.getElementById('task-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const input = document.getElementById('task-name');
      const value = input.value.trim();
      if (!value) return;
      tasks.unshift({ name: value, done: false, createdAt: new Date().toISOString() });
      activity.unshift({ title: 'Task nou', detail: `${value} este în curs de lucru.`, createdAt: new Date().toISOString(), type: 'orange' });
      save();
      input.value = '';
      render();
      setMessage('Task salvat local.');
    });

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace('./auth.html');
    });

    document.getElementById('export').addEventListener('click', () => {
      const data = {
        format: 'github-mini-local-backup',
        version: 1,
        exportedAt: new Date().toISOString(),
        user: getSession(),
        projects,
        tasks,
        repos,
        activity
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'github-mini-backup.json';
      a.click();
      URL.revokeObjectURL(url);
      setMessage('Backup JSON exportat.');
    });

    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const raw = JSON.parse(await file.text());
        if (raw.format !== 'github-mini-local-backup' || !Array.isArray(raw.projects) || !Array.isArray(raw.tasks)) {
          throw new Error('Format invalid pentru backup.');
        }
        projects = raw.projects;
        tasks = raw.tasks;
        repos = Array.isArray(raw.repos) ? raw.repos : repos;
        activity = Array.isArray(raw.activity) ? raw.activity : activity;
        save();
        render();
        setMessage('Backup importat cu succes.');
      } catch (error) {
        setMessage(error.message || 'Nu s-a putut importa backup-ul.');
      } finally {
        event.target.value = '';
      }
    });

    render();
  </script>
</body>
</html>
