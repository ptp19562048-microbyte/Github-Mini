<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="Dashboard local Github Mini." />
  <title>Dashboard — Github Mini</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#171d2a;--panel-strong:#111827;--text:#e6edf3;--muted:#9aa7b5;--border:rgba(148,163,184,.2);--blue:#2f81f7;--green:#3fb950;--yellow:#fbbf24;--danger:#f87171;--shadow:0 20px 45px rgba(0,0,0,.38)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at top,rgba(47,129,247,.18),transparent 26%),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.container{width:min(1200px,calc(100% - 24px));margin:auto}.header{border-bottom:1px solid var(--border);background:rgba(13,17,23,.9);backdrop-filter:blur(10px)}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;color:var(--text);text-decoration:none}.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#fff,#aab7c4);position:relative}.brand-mark:after{content:"";position:absolute;inset:7px;border-radius:4px;background:#111827}.actions{display:flex;align-items:center;gap:8px}.btn{display:inline-flex;min-height:42px;align-items:center;justify-content:center;padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);color:var(--text);font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.btn:hover{border-color:rgba(47,129,247,.8)}.btn.primary{background:linear-gradient(180deg,#388bfd,#1f6feb);border-color:#388bfd}.main{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{padding:18px 14px;border-right:1px solid var(--border);background:rgba(15,23,42,.55)}.profile{padding:14px;border:1px solid var(--border);border-radius:16px;background:rgba(17,24,39,.8);margin-bottom:16px}.profile .meta{font-size:.88rem;color:var(--muted)}.profile strong{display:block;margin-bottom:4px}.nav-list{display:flex;flex-direction:column;gap:8px}.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid transparent;border-radius:10px;color:var(--muted);background:transparent}.nav-item.active{color:var(--text);background:rgba(47,129,247,.08);border-color:rgba(47,129,247,.2)}.content{padding:28px 20px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.topbar h1{margin:0;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.05em}.pill{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid rgba(240,136,62,.38);border-radius:999px;background:rgba(240,136,62,.08);color:#fbd3ad;font-size:.76rem;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:rgba(22,27,34,.82)}.stat-label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:clamp(1.4rem,2vw,2.1rem);margin-top:8px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{padding:18px;border:1px solid var(--border);border-radius:18px;background:rgba(22,27,34,.82);box-shadow:var(--shadow)}.panel h2{margin:0 0 12px;font-size:1.08rem}.form-grid{display:grid;grid-template-columns:1fr auto;gap:10px}.field{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#0d1117;color:var(--text)}.add-btn{width:auto;min-width:120px}.project-list,.task-list{display:flex;flex-direction:column;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(17,24,39,.8)}.item strong{display:block}.item small{color:var(--muted)}.remove{border:1px solid var(--border);background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid var(--border);font-size:.72rem;font-weight:700}.tag.green{color:#a7f3d0;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}.tag.orange{color:#fdba74;border-color:rgba(240,136,62,.35);background:rgba(240,136,62,.08)}.repo-list{display:flex;flex-direction:column;gap:10px}.repo-item{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(17,24,39,.8)}.repo-item strong{display:block;margin-bottom:5px}.repo-item small{color:var(--muted)}.footer-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.input-file{display:none}#message{min-height:24px;color:#fca5a5;margin:0 0 10px}.warning{margin-top:16px;padding:12px;border:1px solid rgba(240,136,62,.3);border-radius:10px;background:rgba(240,136,62,.08);color:#fbd3ad;font-size:.86rem}@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.topbar{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.actions{gap:6px}.btn{padding:8px 10px}}
  </style>
</head>
<body>
  <header class="header"><div class="container nav"><a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"></span><span>Github Mini</span></a><div class="actions"><button class="btn primary" id="logout" type="button">Ieși</button></div></div></header>
  <div class="container main">
    <aside class="sidebar">
      <div class="profile"><strong id="user-name">Utilizator</strong><div class="meta">Mod local · fără verificare</div></div>
      <nav class="nav-list">
        <div class="nav-item active">Overview</div>
        <div class="nav-item">Projects</div>
        <div class="nav-item">Tasks</div>
        <div class="nav-item">Activity</div>
      </nav>
    </aside>
    <main class="content">
      <div class="topbar"><h1>Dashboard</h1><span class="pill">Local demo</span></div>
      <p id="message" role="status" aria-live="polite"></p>
      <section class="stats">
        <div class="stat"><div class="stat-label">Proiecte</div><strong id="count-projects">0</strong></div>
        <div class="stat"><div class="stat-label">Task-uri</div><strong id="count-tasks">0</strong></div>
        <div class="stat"><div class="stat-label">Repouri</div><strong id="count-repos">0</strong></div>
        <div class="stat"><div class="stat-label">Status</div><strong>Live</strong></div>
      </section>
      <section class="layout">
        <div>
          <div class="panel">
            <h2>Adaugă proiect</h2>
            <form id="project-form">
              <div class="form-grid"><input class="field" id="project-name" type="text" maxlength="80" placeholder="Numele proiectului" required /><button class="btn primary add-btn" type="submit">Adaugă</button></div>
            </form>
            <div class="project-list" id="project-list"></div>
            <div class="footer-actions"><button class="btn" id="export" type="button">Exportă backup</button><button class="btn" id="import-btn" type="button">Importă backup</button><input class="input-file" id="import-file" type="file" accept="application/json,.json" />
            </div>
            <div class="warning">Datele sunt stocate local în browser. Exportă backup-ul dacă vrei să-l păstrezi.</div>
          </div>
        </div>
        <div>
          <div class="panel">
            <h2>Adaugă task</h2>
            <form id="task-form">
              <div class="form-grid"><input class="field" id="task-name" type="text" maxlength="80" placeholder="Task nou" required /><button class="btn primary add-btn" type="submit">Salvează</button></div>
            </form>
            <div class="task-list" id="task-list"></div>
          </div>
          <div class="panel" style="margin-top:16px;">
            <h2>Repo-uri</h2>
            <div class="repo-list" id="repo-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const SESSION_KEY = 'github-mini-session';
    const PROJECT_KEY = 'github-mini-projects';
    const TASK_KEY = 'github-mini-tasks';
    const REPO_KEY = 'github-mini-repos';

    const defaultRepos = [
      { name: 'github-mini/ui', status: 'Activ', type: 'green' },
      { name: 'github-mini/api', status: 'În lucru', type: 'orange' },
      { name: 'github-mini/cli', status: 'Nou', type: 'green' }
    ];

    const getSession = () => {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch {
        return null;
      }
    };

    const getData = (key, fallback) => {
      try {
        const value = JSON.parse(localStorage.getItem(key) || 'null');
        return Array.isArray(value) ? value : fallback;
      } catch {
        return fallback;
      }
    };

    const session = getSession();
    if (!session?.name) {
      window.location.replace('./auth.html');
    }

    document.getElementById('user-name').textContent = session?.name || 'Utilizator';

    let projects = getData(PROJECT_KEY, [{ name: 'Github Mini v1', createdAt: new Date().toISOString() }]);
    let tasks = getData(TASK_KEY, [
      { name: 'Componente dashboard responsive', createdAt: new Date().toISOString(), done: true },
      { name: 'Îmbunătățire login local', createdAt: new Date().toISOString(), done: false },
      { name: 'Export backup JSON', createdAt: new Date().toISOString(), done: false }
    ]);
    let repos = getData(REPO_KEY, defaultRepos);

    const save = () => {
      localStorage.setItem(PROJECT_KEY, JSON.stringify(projects));
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
      localStorage.setItem(REPO_KEY, JSON.stringify(repos));
    };

    const renderProjects = () => {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      if (!projects.length) {
        const empty = document.createElement('div');
        empty.className = 'item';
        empty.innerHTML = '<div><strong>Fără proiecte</strong><small>Adaugă unul în câmpul de mai sus.</small></div>';
        list.appendChild(empty);
      }
      projects.forEach((project, idx) => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `<div><strong>${project.name}</strong><small>${new Date(project.createdAt).toLocaleDateString()}</small></div><button type="button" class="remove" data-index="${idx}">Șterge</button>`;
        list.appendChild(row);
      });
      list.querySelectorAll('.remove').forEach(button => {
        button.addEventListener('click', () => {
          const idx = Number(button.dataset.index);
          projects.splice(idx, 1);
          save();
          render();
        });
      });
    };

    const renderTasks = () => {
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      if (!tasks.length) {
        const empty = document.createElement('div');
        empty.className = 'item';
        empty.innerHTML = '<div><strong>Fără task-uri</strong><small>Poți crea unul acum.</small></div>';
        list.appendChild(empty);
      }
      tasks.forEach((task, idx) => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `<div><strong>${task.name}</strong><small>${task.done ? 'Finalizat' : 'În desfășurare'}</small></div><span class="tag ${task.done ? 'green' : 'orange'}">${task.done ? 'Done' : 'Todo'}</span>`;
        row.addEventListener('click', () => {
          tasks[idx].done = !tasks[idx].done;
          save();
          render();
        });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = 'Șterge';
        remove.addEventListener('click', (event) => {
          event.stopPropagation();
          tasks.splice(idx, 1);
          save();
          render();
        });
        row.appendChild(remove);
        list.appendChild(row);
      });
    };

    const renderRepos = () => {
      const list = document.getElementById('repo-list');
      list.innerHTML = '';
      repos.forEach(repo => {
        const item = document.createElement('div');
        item.className = 'repo-item';
        item.innerHTML = `<strong>${repo.name}</strong><small>${repo.status}</small>`;
        list.appendChild(item);
      });
    };

    const renderStats = () => {
      document.getElementById('count-projects').textContent = String(projects.length);
      document.getElementById('count-tasks').textContent = String(tasks.length);
      document.getElementById('count-repos').textContent = String(repos.length);
    };

    const render = () => {
      renderProjects();
      renderTasks();
      renderRepos();
      renderStats();
    };

    document.getElementById('project-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const input = document.getElementById('project-name');
      const value = input.value.trim();
      if (!value) return;
      projects.unshift({ name: value, createdAt: new Date().toISOString() });
      input.value = '';
      save();
      render();
      setMessage('Proiect adăugat local.');
    });

    document.getElementById('task-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const input = document.getElementById('task-name');
      const value = input.value.trim();
      if (!value) return;
      tasks.unshift({ name: value, done: false, createdAt: new Date().toISOString() });
      input.value = '';
      save();
      render();
      setMessage('Task salvat local.');
    });

    function setMessage(text) {
      const box = document.getElementById('message');
      box.textContent = text;
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace('./auth.html');
    });

    document.getElementById('export').addEventListener('click', () => {
      const data = {
        format: 'github-mini-local-backup',
        version: 1,
        exportedAt: new Date().toISOString(),
        user: getSession(),
        projects,
        tasks,
        repos
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'github-mini-backup.json';
      link.click();
      URL.revokeObjectURL(url);
      setMessage('Backup JSON exportat.');
    });

    document.getElementById('import-btn').addEventListener('click', () => {
      document.getElementById('import-file').click();
    });

    document.getElementById('import-file').addEventListener('change', async function(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const raw = JSON.parse(await file.text());
        if (raw.format !== 'github-mini-local-backup' || !Array.isArray(raw.projects) || !Array.isArray(raw.tasks)) {
          throw new Error('Format invalid pentru backup.');
        }
        projects = raw.projects;
        tasks = raw.tasks;
        repos = Array.isArray(raw.repos) ? raw.repos : repos;
        save();
        render();
        setMessage('Backup importat cu succes.');
      } catch (error) {
        setMessage(error.message || 'Nu s-a putut importa backup-ul.');
      } finally {
        event.target.value = '';
      }
    });

    render();
  </script>
</body>
</html>
